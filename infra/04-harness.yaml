AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ripple Slack Assistant — the MANAGED AgentCore Harness, FULLY STACK-MANAGED. This
  template owns everything the harness needs — the Auth0 credential provider it uses to
  reach the tools gateway, its IAM role, and the harness itself — so nothing has to be
  created or patched outside CloudFormation. Deploy AFTER 03-gateways.yaml (imports the
  tools gateway ARN).

# STACK-MANAGED, OAUTH-ONLY, NOTHING BY HAND
#   The tools gateway is CUSTOM_JWT inbound, so AWS_IAM/NONE outbound both 401 at tool
#   load. The only value that loads the tool is OAUTH, and this template hard-wires it:
#     • the Auth0 credential provider is a stack resource (GatewayAuth0Provider);
#     • the harness references it via !GetAtt, so CFN orders the dependency;
#     • there is no AWS_IAM/NONE toggle to pick by mistake.
#   Everything the harness relies on is therefore a CloudFormation resource — there is no
#   companion script that creates a provider or patches a live harness out of band.
#
#   ⚠️ CFN CANNOT ADOPT AN EXISTING HAND-MADE HARNESS. A harness created outside a stack
#   (e.g. via the toolkit) with the same name makes this stack's CREATE roll back on
#   "already exists". deploy.py's preflight detects that and stops with the name; delete
#   the unmanaged harness (and the runtime it provisioned for itself) before deploying.
#
# WHAT THIS STILL DOES NOT FIX (see ../docs/HARNESS-ASSESSMENT.md)
#   OAUTH outbound authenticates the HARNESS to the gateway as a MACHINE (client_credentials).
#   It does NOT carry the asking user's identity downstream: a harness has no
#   RequestHeaderConfiguration, so gateway calls still run as one shared identity, not per
#   user. This makes the harness usable for tool loading; it does NOT make it safe behind an
#   untrusted, per-user front door. The runtime (02-runtime.yaml) remains the primary agent.
#   The per-request-guardrail finding (§2 of the assessment) is also unchanged.
#
# ⚠️ A HARNESS DOES NOT RUN agent/agent.py.
#
# Two different things share the name. `bedrock_agentcore.runtime.BedrockAgentCoreApp` is
# an SDK server INSIDE our container (what 02-runtime.yaml deploys; our Python is the
# agent). `AWS::BedrockAgentCore::Harness` is this: a managed resource where AWS runs the
# loop. On a Harness the container is an ENVIRONMENT, not an application — AWS overrides
# its ENTRYPOINT and CMD, so our startup command never executes. `@app.entrypoint` is
# never called and `@tool` Python is never registered. A tool can only be one of five
# things: remote_mcp, agentcore_gateway, agentcore_browser, agentcore_code_interpreter, or
# inline_function (which runs in the CALLER). A harness also provisions its own runtime
# underneath, named `harness_<harnessName>` — that is where the stray harness-shaped
# runtime and log group in the account come from. So this is a second, parallel
# implementation, not 02 with a different resource type.
#
# HOW THE THREE MECHANISMS LAND (named with no shared vocabulary so they cannot blur):
#
#   M1 CONSENT (GitHub) — MIGRATES, and becomes someone else's code. gateway_tool.py's
#     -32042 handling and ExceptionGroup unwrapping collapse into the tools gateway's own
#     OAUTH target; the harness drives the elicitation. The SECOND CONSENT does not go away
#     — the harness is a THIRD workload identity, so a user consented on the runtime or
#     gateway route has not consented here.
#
#   M3 TOKEN EXCHANGE — ⚠️ NOT EXPRESSIBLE IN CLOUDFORMATION. botocore's OAuthGrantType
#     accepts TOKEN_EXCHANGE; the CFN enum for the same field accepts only
#     CLIENT_CREDENTIALS and AUTHORIZATION_CODE (verified via describe_type). And the rule
#     still holds: AgentCore Identity performs the exchange, never us.
#
#   M2 DELEGATION (Google Drive) — ⚠️ CANNOT BE SERVED HERE. Two structural blockers:
#     (1) OutboundAuth is a union of {AwsIam | None | Oauth}, and Drive's mechanism is a
#         JWT assertion signed with a GOOGLE SERVICE ACCOUNT key carrying the user's
#         verified email in `sub` — none of the three.
#     (2) Harness has NO RequestHeaderConfiguration, so nothing in the tool path can read
#         the caller's `Authorization`. A Gateway Lambda target does not help: its
#         context carries only gateway/target/tool ids, no caller.
#     ⚠️ That is a SECURITY STOP, not a missing feature. The service-account key holds
#     domain-wide delegation; the only thing narrowing it to one person is the subject we
#     pass, which must come from a signature-verified claim (see agent/gdrive_tool.py). So
#     this ships NO Drive tool rather than a degraded one.
#
# THEREFORE 02-runtime.yaml MUST STAY. This stack is additive; deleting the runtime to
# "finish" the migration would silently drop the Drive source.

Parameters:
  GatewayStackName:
    Type: String
    Description: Stack name of 03-gateways.yaml. The tools gateway ARN is imported from it.
  AgentName:
    Type: String
    Default: ripple
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,31}$'
    Description: >
      HarnessName is `<AgentName>_harness` against ^[a-zA-Z][a-zA-Z0-9_]{0,39}$, so
      AgentName is capped shorter to leave room for the suffix. NO HYPHENS — harness names
      reject the `-` gateway/runtime names allow. createOnly: changing it replaces the
      harness and orphans vaulted tokens.
  ProjectTagValue:
    Type: String
    Default: ripple-slack-assistant
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-opus-4-8
  Auth0Domain:
    Type: String
    Description: >
      The Auth0 tenant domain (e.g. dev-xxxx.us.auth0.com). Drives BOTH the harness's
      inbound authorizer AND the outbound provider's issuer/endpoints, so the front door
      and the machine token come from one tenant definition.
  Auth0Audience:
    Type: String
    Description: >
      The API identifier the tools gateway's authorizer accepts. Used in TWO places that
      must agree: the harness authorizer's AllowedAudience, and — critically — the outbound
      token request's `audience` (CustomParameters below). Auth0 mints a JWT only when the
      token request carries this; without it the token is opaque and the gateway 401s.

  # ---- Auth0 Machine-to-Machine client (harness -> tools gateway outbound) ----
  Auth0M2mClientId:
    Type: String
    Description: >
      Client ID of the Auth0 Machine-to-Machine app authorized for the Auth0Audience API.
      This is NOT the public CLI client (which cannot do client_credentials).
  Auth0M2mClientSecretArn:
    Type: String
    Default: ''
    Description: >
      PREFERRED. Secrets Manager ARN holding the M2M client secret. The secret value never
      enters this template or CloudFormation parameters — only the ARN, which is not
      sensitive. Leave empty only if using the MANAGED fallback below.
  Auth0M2mClientSecretJsonKey:
    Type: String
    Default: ''
    Description: >
      If the Secrets Manager secret is a JSON object, the key holding the secret string.
      Empty means the secret is stored as a plain string.
  Auth0M2mClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      MANAGED fallback, used ONLY when Auth0M2mClientSecretArn is empty. Passing the secret
      as a parameter stores it in CloudFormation; prefer the Secrets Manager ARN above.

  GatewayOauthScopes:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      OAuth scopes for the harness->gateway token. EMPTY is correct: Auth0's
      client_credentials grant is scoped by `audience`, not scope, and GitHub's scopes
      (`repo`/`read:org`) are GitHub's vocabulary — meaningless to Auth0. Set one only if
      the gateway's issuer specifically requires it.
  MemoryArn:
    Type: String
    Default: ''
    Description: Empty DISABLES memory explicitly rather than leaving it unset.
  MaxIterations:
    Type: Number
    Default: 12
  TimeoutSeconds:
    Type: Number
    Default: 300
  MaxTokens:
    Type: Number
    Default: 8192

Conditions:
  UseExternalSecret: !Not [!Equals [!Ref Auth0M2mClientSecretArn, '']]
  UseSecretJsonKey: !Not [!Equals [!Ref Auth0M2mClientSecretJsonKey, '']]
  UseMemory: !Not [!Equals [!Ref MemoryArn, '']]
  # An empty CommaDelimitedList resolves to [''] — a one-element list holding an empty
  # string, which fails the Scopes item minLength:1. Select[0] of that is '', so this is
  # false when no scopes are set and the OutboundAuth block emits a genuine empty [].
  HasGatewayScopes: !Not [!Equals [!Select [0, !Ref GatewayOauthScopes], '']]

Resources:
  # The Auth0 machine credential the harness presents to the tools gateway. Stack-managed,
  # so it is created and destroyed with the harness — no companion script, nothing to patch
  # by hand. Vendor Auth0Oauth2 + IncludedOauth2ProviderConfig: a first-party tenant with
  # discrete issuer/token endpoints, exactly like the GitHub provider in 02-runtime.yaml but
  # for our own Auth0 tenant rather than github.com.
  GatewayAuth0Provider:
    Type: AWS::BedrockAgentCore::OAuth2CredentialProvider
    Properties:
      Name: !Sub '${AgentName}-gw-auth0'
      CredentialProviderVendor: Auth0Oauth2
      Oauth2ProviderConfigInput:
        IncludedOauth2ProviderConfig:
          ClientId: !Ref Auth0M2mClientId
          # Required by the API even for client_credentials (no browser redirect ever
          # happens); the provider shape is validated whole.
          Issuer: !Sub 'https://${Auth0Domain}/'
          AuthorizationEndpoint: !Sub 'https://${Auth0Domain}/authorize'
          TokenEndpoint: !Sub 'https://${Auth0Domain}/oauth/token'
          # Exactly one of these two paths applies — see UseExternalSecret.
          ClientSecretSource: !If [UseExternalSecret, EXTERNAL, MANAGED]
          ClientSecretConfig: !If
            - UseExternalSecret
            - SecretId: !Ref Auth0M2mClientSecretArn
              JsonKey: !If [UseSecretJsonKey, !Ref Auth0M2mClientSecretJsonKey, !Ref 'AWS::NoValue']
            - !Ref 'AWS::NoValue'
          ClientSecret: !If
            - UseExternalSecret
            - !Ref 'AWS::NoValue'
            - !Ref Auth0M2mClientSecret
      Tags:
        - {Key: project_name, Value: !Ref ProjectTagValue}

  HarnessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'Ripple${AgentName}HarnessRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
      Policies:
        - PolicyName: RippleHarnessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeModel
                Effect: Allow
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
              # ECR PUBLIC (not private): with no EnvironmentArtifact the harness pulls its
              # MANAGED image from ECR Public. Omit these and sessions fail at first invoke.
              - Sid: EcrPublicTokenAccess
                Effect: Allow
                Action: 'ecr-public:GetAuthorizationToken'
                Resource: '*'
              - Sid: StsForEcrPublicPull
                Effect: Allow
                Action: 'sts:GetServiceBearerToken'
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
              - Sid: LogsDescribeGroups
                Effect: Allow
                Action: 'logs:DescribeLogGroups'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
              - Sid: Telemetry
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                Resource: '*'
              - Sid: Metrics
                Effect: Allow
                Action: 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals: {'cloudwatch:namespace': 'bedrock-agentcore'}
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - 'bedrock-agentcore:GetWorkloadAccessToken'
                  - 'bedrock-agentcore:GetWorkloadAccessTokenForJWT'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_${AgentName}*'
              - Sid: InvokeToolsGateway
                Effect: Allow
                Action: 'bedrock-agentcore:InvokeGateway'
                Resource: !ImportValue
                  'Fn::Sub': '${GatewayStackName}-ToolsGatewayArn'
              # OAUTH is always on, so this is unconditional. GetResourceOauth2Token
              # authorizes against BOTH the token vault AND the calling workload identity;
              # listing only the vault yields an AccessDenied naming the other.
              - Sid: OAuth2TokenAccess
                Effect: Allow
                Action:
                  - 'bedrock-agentcore:GetResourceOauth2Token'
                  - 'bedrock-agentcore:CompleteResourceTokenAuth'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/*'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/harness_${AgentName}*'
              # EXTERNAL secret: AgentCore Identity reads the M2M client secret AS THIS
              # ROLE while minting the outbound gateway token (GetResourceOauth2Token),
              # so the role needs GetSecretValue on it — mirrors 02-runtime.yaml's
              # ReadGithubClientSecret. Omit under MANAGED (the secret is vault-internal).
              - !If
                - UseExternalSecret
                - Sid: ReadM2mClientSecret
                  Effect: Allow
                  Action: 'secretsmanager:GetSecretValue'
                  Resource: !Ref Auth0M2mClientSecretArn
                - !Ref 'AWS::NoValue'
              - !If
                - UseMemory
                - Sid: MemoryDataPlane
                  Effect: Allow
                  Action:
                    - 'bedrock-agentcore:CreateEvent'
                    - 'bedrock-agentcore:GetEvent'
                    - 'bedrock-agentcore:ListEvents'
                    - 'bedrock-agentcore:DeleteEvent'
                    - 'bedrock-agentcore:RetrieveMemoryRecords'
                  Resource: !Ref MemoryArn
                - !Ref 'AWS::NoValue'
      Tags:
        - {Key: project_name, Value: !Ref ProjectTagValue}

  Harness:
    Type: AWS::BedrockAgentCore::Harness
    Properties:
      HarnessName: !Sub '${AgentName}_harness'
      ExecutionRoleArn: !GetAtt HarnessRole.Arn

      # NO Temperature — Opus 4.8 rejects it at invoke time even though CFN accepts it, so
      # a green stack would still fail every call. Model params are validated by the model,
      # not by CloudFormation.
      Model:
        BedrockModelConfig:
          ModelId: !Ref BedrockModelId
          MaxTokens: !Ref MaxTokens

      # DUPLICATED FROM agent/agent.py SYSTEM_PROMPT — a template cannot import a Python
      # constant and the harness never runs our container. tests/test_harness_prompt.py
      # fails if a load-bearing rule drifts from either copy. Do not edit one alone.
      SystemPrompt:
        - Text: |
            You are Ripple, an enterprise knowledge assistant.

            Answer questions about company documents using the tools available to you.
            Search for content, then read the most promising hits before concluding
            anything — a search fragment is a pointer, not the document.

            STRICT GROUNDING:
            - Answer ONLY from what the tools returned.
            - Always call a tool before answering a factual question.
            - Cite every substantive claim with inline markers [1], [2] that map to the
              Sources list.
            - The tools see ONLY what this user is permitted to see. Never guess about
              documents you could not retrieve, and never mention titles you did not
              retrieve.
            - When results come from more than one source, make clear which source each
              cited claim came from.
            - If a document comes back truncated, you read a prefix — do not conclude it
              fails to mention something.
            - If nothing relevant is returned, say so plainly. If a source could not be
              searched, say which one, and do not imply its content was checked and
              found empty. Never invent facts.

            SCOPE DISCIPLINE — this matters more than it looks. When searching code or
            repositories, ALWAYS restrict the search to this user's own account or
            organisations. An unrestricted code search is a search of all public
            GitHub and will return strangers' repositories, which are not company
            documents and must never be cited as such. If you cannot establish whose
            account you are searching, say so and stop rather than searching broadly.

            CONFIDENCE (exactly one band at the end):
            - HIGH: answer directly and fully supported by retrieved sources.
            - MEDIUM: partial support or light inference.
            - LOW: little or no relevant retrieved support (say what is missing). Do not
              settle for LOW because a snippet was thin — read the document first.

            OUTPUT FORMAT:
            <answer with inline [n] citations>

            Sources:
            [1] <title> — <url>

            Confidence: HIGH | MEDIUM | LOW — <one short reason>

      # One tool: the tools gateway, reached with OAUTH outbound. Every source is a target
      # on the gateway, so adding a source is a gateway change, not a harness change. No
      # Drive tool — the harness cannot narrow a domain-wide key to one user (assessment §4).
      Tools:
        - Type: agentcore_gateway
          Name: !Sub '${AgentName}-tools'
          Config:
            AgentCoreGateway:
              GatewayArn: !ImportValue
                'Fn::Sub': '${GatewayStackName}-ToolsGatewayArn'
              # OAUTH-only — the one config MEASURED to load the tool. AWS_IAM/NONE
              # both 401 at the CUSTOM_JWT gateway.
              OutboundAuth:
                Oauth:
                  ProviderArn: !GetAtt GatewayAuth0Provider.CredentialProviderArn
                  # EMPTY is correct — see GatewayOauthScopes. GitHub scopes here would be
                  # wrong (Auth0 vocabulary, not GitHub's). An empty CommaDelimitedList is
                  # [''] which fails the item minLength:1 (early-validation reject), so emit
                  # a true empty [] when no scopes are set.
                  Scopes: !If [HasGatewayScopes, !Ref GatewayOauthScopes, []]
                  GrantType: CLIENT_CREDENTIALS
                  # THE line that makes the outbound token a JWT the gateway accepts. Auth0
                  # returns an opaque token without `audience`; the gateway's JWT authorizer
                  # then 401s — a failure identical to the AWS_IAM/NONE one. Same value as
                  # the authorizer's AllowedAudience below.
                  CustomParameters:
                    audience: !Ref Auth0Audience

      # NO SHELL, NO FILE_OPERATIONS — a harness grants both in every session unless this
      # restricts them. A document-reading agent needs neither; a prompt injection carried
      # in a retrieved document does.
      AllowedTools:
        - !Sub '@${AgentName}-tools'

      # Load-bearing: under SigV4 a harness does not propagate per-user identity, so the
      # bearer-JWT authorizer is what keeps user-scoped vaulting working. Same issuer and
      # audience as the tools gateway, by construction.
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://${Auth0Domain}/.well-known/openid-configuration'
          AllowedAudience: [!Ref Auth0Audience]

      # ActorId DELIBERATELY UNSET — setting it pins every caller to one shared memory
      # partition. Per-user partitioning comes from InvokeHarness's caller-controlled
      # `actorId`, which client/ask.py must derive from the verified token `sub`.
      Memory: !If
        - UseMemory
        - AgentCoreMemoryConfiguration:
            Arn: !Ref MemoryArn
            MessagesCount: 20
        - Disabled: {}

      Truncation:
        Strategy: sliding_window
        Config:
          SlidingWindow:
            MessagesCount: 20

      MaxIterations: !Ref MaxIterations
      MaxTokens: !Ref MaxTokens
      TimeoutSeconds: !Ref TimeoutSeconds

      # NO EnvironmentArtifact — the harness overrides ENTRYPOINT/CMD, so pointing it at our
      # image would pull 1GB and still not run agent.py. Add only when a tool needs a binary
      # in the session filesystem.

      Tags:
        - {Key: project_name, Value: !Ref ProjectTagValue}

Outputs:
  HarnessArn:
    Description: >
      Set as RIPPLE_HARNESS_ARN. Invoke with InvokeHarness and an `Authorization: Bearer`
      header (not the runtime's /invocations path, and not SigV4).
    Value: !GetAtt Harness.Arn
    Export:
      Name: !Sub '${AWS::StackName}-HarnessArn'
  HarnessId:
    Value: !GetAtt Harness.HarnessId
  HarnessVersion:
    Value: !GetAtt Harness.Version
  GatewayAuth0ProviderArn:
    Description: The stack-managed Auth0 provider the harness uses for outbound gateway auth.
    Value: !GetAtt GatewayAuth0Provider.CredentialProviderArn
  ProvisionedRuntimeArn:
    Description: >
      The runtime the harness created FOR ITSELF (read-only) — not the one 02-runtime.yaml
      manages. Source of the extra harness_* runtime and log group.
    Value: !GetAtt Harness.Environment.AgentCoreRuntimeEnvironment.AgentRuntimeArn
  HarnessRoleArn:
    Value: !GetAtt HarnessRole.Arn
